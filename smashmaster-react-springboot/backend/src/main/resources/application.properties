server.port=${PORT:8080}
server.error.include-message=always
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smashmaster}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smashmaster}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:smashmaster}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
